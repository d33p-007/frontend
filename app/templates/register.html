{% extends 'base.html' %}

{% block title %}Create Account - WebApp{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h1>Join PureVibe Wellness</h1>
        <p>Create your account and begin your journey toward a healthier lifestyle.</p>
    </div>

    <form method="POST">
        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-input" placeholder="Full Name" required>
        </div>

        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <div class="form-checkbox-wrapper">
            <input type="checkbox" id="agree-terms" class="form-checkbox" required>
            <label for="agree-terms" class="checkbox-label">
                I agree to the Terms of Service and Privacy Policy.
            </label>
        </div>

        <button type="submit" class="btn-primary-submit">Register Account</button>
    </form>

    <div class="auth-footer-link">
        Already have an account? 
        <a href="{{ url_for('login') }}">Sign in here</a>
    </div>
</div>
{% endblock %}
