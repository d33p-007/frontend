{% extends 'base.html' %}

{% block title %}Contact Support - WebApp{% endblock %}

{% block content %}
<div class="contact-card">
    <div class="contact-hero-banner">
        <h1>Connect With Us</h1>
        <p>Have operation tracking questions or system architecture feedback? Drop us a note.</p>
    </div>
    
    <form class="contact-form-body" onsubmit="event.preventDefault(); alert('Message transmission simulated safely!');">
        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" placeholder="Full Name" required>
        </div>

        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" placeholder="test@example.com" required>
        </div>

        <div class="form-group">
            <label class="form-label">Message Body</label>
            <textarea class="form-input form-textarea" placeholder="How can our layout infrastructure support your project goals?" required></textarea>
        </div>

        <button type="submit" class="btn-primary-submit">Send Message</button>
    </form>
</div>
{% endblock %}
