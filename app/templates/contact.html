{% extends 'base.html' %}

{% block title %}Contact Support - WebApp{% endblock %}

{% block content %}
<div class="contact-card">
    <div class="contact-hero-banner">
        <h1>Connect PureVibe Wellness</h1>
        <p>Have questions about diet plans, fitness programs, or wellness services? we'd love to hear from you.</p>
    </div>
    
    <form class="contact-form-body" onsubmit="event.preventDefault(); alert('Message transmission simulated safely!');">
        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" placeholder="Full Name" required>
        </div>

        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" placeholder="test@example.com" required>
        </div>

        <div class="form-group">
            <label class="form-label">Message Body</label>
            <textarea class="form-input form-textarea" placeholder="Tell us how we can help you on your wellness journey." required></textarea>
        </div>

        <button type="submit" class="btn-primary-submit">Send Message</button>
    </form>
</div>
{% endblock %}
