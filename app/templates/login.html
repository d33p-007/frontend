{% extends 'base.html' %}

{% block title %}Sign In - WebApp{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h1>Welcome Back to PureVibe</h1>
        <p>Sign in to continue your wellness journey.</p>
    </div>

    <form method="POST">
        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <div class="form-label-row">
                <label class="form-label">Password</label>
                <a href="#" class="text-link-xs">Forgot password?</a>
            </div>
            <input type="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary-submit">Sign In</button>
    </form>

    <div class="auth-footer-link">
        Don't have an account? 
        <a href="{{ url_for('register') }}">Create an account</a>
    </div>
</div>
{% endblock %}
