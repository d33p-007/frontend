<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - PureVibe Wellness</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/starter-template.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="logo">PureVibe Wellness</div>
        <nav>
            <a href="/">Home</a>
            <a href="/signup">Register</a>
            <a href="/login">Login</a>
        </nav>
    </header>

    <main class="form-page">
        <section class="form-card">
            <h1>Welcome Back</h1>
            <p>Sign in to continue your wellness journey.</p>

            <form action="/dashboard" method="get">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username">

                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password">

                <button type="submit">Login</button>
            </form>

            <p class="small-text">Don’t have an account? <a href="/signup">Register here</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 PureVibe Wellness | Seattle, WA</p>
    </footer>
</body>
</html>
