# .github/workflows/dast-scan.yml
# ─────────────────────────────────────────────────────────────────────────────
# Manual DAST scan — OWASP ZAP baseline against the live dev environment.
# Trigger: workflow_dispatch — run AFTER a successful deploy to dev.
# ─────────────────────────────────────────────────────────────────────────────

name: "DAST Scan — OWASP ZAP"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Full URL to scan — "
        required: false
        default: ""
      environment_label:
        description: "Label for the report — e.g. GCP"
        required: false
        default: "dev"

jobs:
  dast:
    name: "OWASP ZAP Baseline Scan"
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
