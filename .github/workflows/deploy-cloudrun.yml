# .github/workflows/deploy-cloudrun.yml

# ─────────────────────────────────────────────────────────────────────────

# Builds the Flask app container, pushes to Artifact Registry,

# and deploy to Cloud Run. Manual trigger — same promotion gate as

# the on-premise deploy-staging.yml and deploy-prod.yml

# ─────────────────────────────────────────────────────────────────────────

name: Deploy to GCP

on:
  workflow_dispatch: # manual trigger — intentional promotion gate

env:
  REGION: us-west1

  PROJECT_ID: cis-410-capstone # Replace with your GCP Project ID

  REGISTRY: us-west1-docker.pkg.dev

  REPO: cis410-capstone-app

  IMAGE: flask-app-frontend

  SERVICE: cis410-flask-app-capstone-frontend

jobs:
  # 1. BUILD and PUSH STAGE
  build-and-push:
    runs-on: ubuntu-latest
    # REQUIRED: This permission allows requesting the OIDC JWT token
    permissions:
      contents: read
      id-token: write # required for OIDC
    steps:
      # 1. Checkout repository source code
      - name: Checkout code
        uses: actions/checkout@v4

        # OIDC Authenticate
      - name: Authenticate to GCP via OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_EMAIL }}

      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: "oauth2accesstoken"
          password: ${{ steps.auth.outputs.access_token }}

      # 4. Build and Push container to Artifact Registry
      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}

      # 5. Deploy the image to Google Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}

      # 6. Output the live URL for validation
      - name: Show Live URL
        run: echo "Application deployed successfully! URL is ${{ steps.deploy.outputs.url }}"
