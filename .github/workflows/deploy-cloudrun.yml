# .github/workflows/deploy-cloudrun.yml

# ─────────────────────────────────────────────────────────────────────────

# Builds the Flask app container, pushes to Artifact Registry,

# and deploy to Cloud Run. Manual trigger — same promotion gate as

# the on-premise deploy-staging.yml and deploy-prod.yml

# ─────────────────────────────────────────────────────────────────────────

name: Deploy to GCP

on:
  workflow_dispatch: # manual trigger — intentional promotion gate

env:
  REGION: us-west1

  REGISTRY: us-west1-docker.pkg.dev

  REPO: cis410-capstone-app

  IMAGE: flask-app-frontend

  SERVICE: cis410-flask-app-capstone-frontend

jobs:
  # 1. Build Image
  build:
    runs-on: ubuntu-latest
    outputs:
      image_path_global: ${{ steps.buildc.outputs.image_path_output }}
    # REQUIRED: This permission allows requesting the OIDC JWT token
    permissions:
      contents: read
      id-token: write # required for OIDC
    steps:
      # Checkout repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # OIDC Authenticate
      - name: Authenticate to GCP via OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Build and Push container to Artifact Registry
      - name: Build Container
        id: buildc
        env:
          buildc: ${IMAGE_PATH}
        run: |

          PROJECT_ID=$(gcloud config get-value project)

          IMAGE_PATH=${REGISTRY}/${PROJECT_ID}/${REPO}/${IMAGE}:${{ github.sha }}

          docker build -t ${IMAGE_PATH} .

          echo "image_path_output=${IMAGE_PATH}" >> "$GITHUB_OUTPUT"

          echo "IMAGE_PATH=${IMAGE_PATH}" >> $GITHUB_ENV

  # 1. Push Image
  deploy:
    runs-on: ubuntu-latest
    needs: build
    # REQUIRED: This permission allows requesting the OIDC JWT token
    permissions:
      contents: read
      id-token: write # required for OIDC
    steps:
      # Checkout repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # OIDC Authenticate
      - name: Authenticate to GCP via OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Push container to Artifact Registry
      - name: Push Container
        run: |

          docker build -t ${{ needs.build.outputs.image_path_global }} .

          docker push ${{ needs.build.outputs.image_path_global }}

          echo "IMAGE_PATH=${{ needs.build.outputs.image_path_global }}" >> $GITHUB_ENV

      # Deploy the image to Google Cloud Run
      - name: Deploy to Cloud Run
        id: deploy
        run: |

          gcloud run deploy ${{ env.SERVICE }} --image ${IMAGE_PATH} --region ${{ env.REGION }} --platform managed --allow-unauthenticated --max-instances 3 --quiet

      # Output the live URL for validation
      - name: Show Live URL
        run: |

          echo "Application deployed successfully! URL is - "
          gcloud run services describe ${SERVICE} --region ${REGION} --format "value(status.url)"
