# .github/workflows/deploy-cloudrun.yml

# ─────────────────────────────────────────────────────────────────────────

# Builds the Flask app container, pushes to Artifact Registry,

# and deploy to Cloud Run. Manual trigger — same promotion gate as

# the on-premise deploy-staging.yml and deploy-prod.yml

# ─────────────────────────────────────────────────────────────────────────

name: Deploy to Cloud Run

on:
  workflow_dispatch: # manual trigger — intentional promotion gate

env:
  REGION: us-west1

  REGISTRY: us-west1-docker.pkg.dev

  REPO: cis410-capstone-app

  IMAGE: flask-app-frontend

  SERVICE: cis410-flask-app-capstone-frontend

jobs:
  # 1. BUILD STAGE
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Build and tag with commit SHA — never :latest
      - name: Build image
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          IMAGE_PATH=${REGISTRY}/${PROJECT_ID}/${REPO}/${IMAGE}:${{ github.sha }}
          docker build -t ${IMAGE}:${{ github.sha }} .
          docker tag ${IMAGE} ${IMAGE_PATH}
          echo "IMAGE_PATH=${IMAGE_PATH}" >> $GITHUB_ENV

  # 2. PUSH STAGE
  push:
    runs-on: ubuntu-latest
    needs: build # Will not run if the Build stage fails
    permissions:
      contents: "read"
      id-token: "write" # required for OIDC

    steps:
      # OIDC Authenticate
      - name: Authenticate to GCP via OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      # Build and tag with commit SHA — never :latest
      - name: Push image
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          IMAGE_PATH=${REGISTRY}/${PROJECT_ID}/${REPO}/${IMAGE}:${{ github.sha }}
          docker push ${IMAGE_PATH}
          echo "IMAGE_PATH=${IMAGE_PATH}" >> $GITHUB_ENV

  # 3. DEPLOY STAGE
  deploy:
    runs-on: ubuntu-latest
    needs: push # Ensures deployment only happens after a fresh image is pushed
    permissions:
      contents: "read"
      id-token: "write" # required for OIDC

    steps:
      # OIDC Authenticate
      - name: Authenticate to GCP via OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${SERVICE} --image ${IMAGE_PATH} --region ${REGION} --platform managed --allow-unauthenticated --max-instances 3 --quiet

      - name: Print service URL
        run: |
          gcloud run services describe ${SERVICE} --region ${REGION} --format "value(status.url)"
