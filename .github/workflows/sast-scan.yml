# .github/workflows/sast-scan.yml
# ─────────────────────────────────────────────────────────────────────────────
# Security gate — runs on every pull request to main.
#
# THREE scan jobs:
#   snyk-code       SAST:      scans Python source code on the runner
#   snyk-deps       SCA:       scans dependencies using a venv on the runner
#   snyk-container  Container: builds and scans the image in GCP, then cleans up
#
# REQUIRED SECRETS:
#   SNYK_TOKEN      — app.snyk.io → Account Settings → Auth Token
# ─────────────────────────────────────────────────────────────────────────────

name: "SAST Scan"

on:
  pull_request:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  # ── Job 1: SAST — source code analysis ─────────────────────────────────────
  snyk-code:
    name: "Snyk Code (SAST)"
    runs-on: ubuntu-latest

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_EMAIL }}

      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            SNYK_TOKEN_GCP:projects/my-project/secrets/my-secret-name/versions/latest

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Snyk CLI
        run: |
          curl -sL https://static.snyk.io/cli/latest/snyk-linux -o snyk
          chmod +x snyk
          ./snyk --version

      - name: Snyk Code scan (SAST)
        run: ./snyk code test --severity-threshold=high app/
        env:
          SNYK_TOKEN: SNYK_TOKEN_GCP
