# .github/workflows/sast-scan.yml
# ─────────────────────────────────────────────────────────────────────────────
# Security gate — runs on every pull request to main.
#
# THREE scan jobs:
#   snyk-code       SAST:      scans Python source code on the runner
#   snyk-deps       SCA:       scans dependencies using a venv on the runner
#   snyk-container  Container: builds and scans the image in GCP, then cleans up
#
# REQUIRED SECRETS:
#   SNYK_TOKEN      — app.snyk.io → Account Settings → Auth Token
# ──────────────────────────────────────────────────────────────────────────

name: "Snyk SAST/(SCA - Dependencies)/Container"

on:
  pull_request:
    branches: [main]
permissions:
  id-token: write
  contents: read
env:
  PROJECT_ID: cis-410-capstone

  REGISTRY: us-west1-docker.pkg.dev

  REPO: cis410-capstone-app

  IMAGE: flask-app-frontend

jobs:
  # ── Job 1: SAST — source code analysis
  snyk-scan:
    name: "Snyk SAST/(SCA - Dependencies)/Container"
    runs-on: ubuntu-latest

    steps:
      # Checkout repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # OIDC Authenticate
      - name: Authenticate to GCP via OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SA_EMAIL }}

      # Retrieve the secret values from Secret Manager
      - name: Fetch Synk Secrets
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            SNYK_TOKEN:${{ env.PROJECT_ID }}/Snyk_Capstone_GCP

      # Step 3: Set up Snyk CLI environment
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      # Step 4: Run SAST (Static Application Security Testing / Snyk Code)
      - name: Snyk (SAST) Test
        run: snyk code test --sarif-file-output=snyk-code.sarif
        env:
          SNYK_TOKEN: ${{ steps.secrets.outputs.SNYK_TOKEN }}
        continue-on-error: true

      # Step 5: Run SCA (Software Composition Analysis / Open Source Dependencies)
      - name: Snyk (SCA - Dependencies) Test
        run: snyk test --sarif-file-output=snyk-sca.sarif
        env:
          SNYK_TOKEN: ${{ steps.secrets.outputs.SNYK_TOKEN }}
        continue-on-error: true

      # Build container
      - name: Build Container
        run: |

          IMAGE_PATH=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}

          docker build -t ${IMAGE_PATH} .

      - name: Snyk Container Test
        run: snyk container test ${IMAGE_PATH} --sarif-file-output=snyk-container.sarif
        env:
          SNYK_TOKEN: ${{ steps.secrets.outputs.SNYK_TOKEN }}
        continue-on-error: true

      # Step 7: Upload ALL results to GitHub Security tab
      - name: Upload SAST results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Upload SCA results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca

      - name: Upload Container results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container
